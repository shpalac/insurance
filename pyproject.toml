[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-scanner"
version = "0.1.0"
description = "Read-only research scanner for listed cash-settled index options"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
broker = ["ib_async>=2.0,<3"]

[project.scripts]
insurance = "insurance.cli:main"
insurance-ibkr = "insurance.ibkr:main"

[tool.setuptools.packages.find]
where = ["src"]
