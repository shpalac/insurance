name: LambdaClass research compatibility (synthetic only)
on:
  pull_request:
    paths:
      - "research/lambdaclass_probe.py"
      - "tests/test_lambdaclass_probe.py"
      - "docs/research-lambdaclass.md"
      - ".factory/acceptance/issue_90/**"
      - ".github/workflows/lambdaclass-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-engine-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      # ethnum 1.5.2 relies on the pre-1.97 TryFromIntError layout;
      # GitHub runner Rust 1.99 fails with E0512 while compiling upstream.
      - name: Pin compatible Rust compiler for upstream dependency
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustc --version | grep -F 'rustc 1.96.0'
      - name: Check hosted Rust toolchain
        run: |
          python --version
          rustc --version
          cargo --version
      - name: Install pinned MIT LambdaClass research engine
        run: |
          python -m pip install "maturin>=1.7,<2.0"
          python -m pip install "git+https://github.com/lambdaclass/options_portfolio_backtester.git@afdbacc0b9b9c137edc38d656778f81b84093b2f"
      - name: Verify actual upstream engine with fictional bid and ask
        env:
          LAMBDACLASS_SMOKE_REQUIRED: "1"
        run: |
          python -m unittest discover -s tests -p 'test_lambdaclass_probe.py' -v
          python research/lambdaclass_probe.py --output reports/lambdaclass-synthetic.json
      - name: Preserve synthetic-only engine result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lambdaclass-synthetic-compatibility
          path: reports/lambdaclass-synthetic.json
          if-no-files-found: ignore
