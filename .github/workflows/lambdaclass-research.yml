name: Optional LambdaClass synthetic research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lambdaclass-research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Clone immutable MIT upstream
        run: |
          git clone https://github.com/lambdaclass/options_portfolio_backtester.git /tmp/lambdaclass
          cd /tmp/lambdaclass
          git checkout --detach afdbacc0b9b9c137edc38d656778f81b84093b2f
          test "$(git rev-parse HEAD)" = "afdbacc0b9b9c137edc38d656778f81b84093b2f"
      - name: Install optional Rust-backed engine
        run: |
          python -m pip install --upgrade pip maturin pytest
          cd /tmp/lambdaclass
          python -m pip install -e .
          maturin develop --release --manifest-path rust/ob_python/Cargo.toml || maturin build --release --manifest-path rust/ob_python/Cargo.toml
      - name: Real upstream engine and independent fictional oracle
        run: |
          python -m pytest -q /tmp/lambdaclass/tests/engine/test_capital_conservation.py
          python research/lambdaclass/synthetic_probe.py
          python -m unittest discover -s .factory/acceptance/issue_90 -p 'test_ac_*.py' -v
