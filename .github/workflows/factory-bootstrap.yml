name: Factory bootstrap
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factory-bootstrap-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  static-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Select Python with dependency cache
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .factory/requirements-dev.txt
      - name: Install dependencies
        run: python3 -m pip install -r .factory/requirements-dev.txt
      - name: Validate repository adapter
        run: python3 .factory/scripts/validate_config.py
      - name: Run bootstrap policy tests
        run: python3 -m unittest discover -s .factory/tests -v
  factory-bootstrap-gate:
    runs-on: ubuntu-latest
    needs: [static-policy]
    if: always()
    steps:
      - name: Fail closed if validation failed or was skipped
        env:
          RESULT: ${{ needs.static-policy.result }}
        run: test "$RESULT" = success
