name: Factory verified issue closure
on:
  workflow_run:
    workflows: ["Factory selective CI", "Factory two-issue autonomous delivery canary"]
    types: [completed]
    branches: [main]
  issues:
    types: [edited]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

# Writes are isolated from untrusted acceptance-test execution.
permissions:
  contents: read
concurrency:
  group: insurance-verified-issue-closure
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       ((github.event.workflow_run.name == 'Factory selective CI' &&
         github.event.workflow_run.event == 'push') ||
        (github.event.workflow_run.name == 'Factory two-issue autonomous delivery canary' &&
         github.event.workflow_run.event == 'workflow_dispatch'))) ||
      (github.event_name == 'issues' &&
       github.actor == github.repository_owner) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      proof: ${{ steps.prove.outputs.proof }}
      main_sha: ${{ steps.prove.outputs.main_sha }}
    steps:
      - name: Checkout trusted main without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Install validation dependencies
        run: python3 -m pip install -r .factory/requirements-dev.txt
      - name: Verify all executable acceptance criteria on main
        id: prove
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # github.sha on issue-edit events can reference an older main commit.
          # Bind both proof and privileged apply to the actual trusted checkout.
          MAIN_SHA="$(git rev-parse HEAD)"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          python3 .factory/scripts/post_merge_closure.py prepare --sha "$MAIN_SHA" --output factory-closure-plan.json
      - name: Preserve acceptance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: factory-closure-proof
          path: |
            factory-closure-plan.json
            reports/*.xml
          if-no-files-found: ignore
          retention-days: 30

  close:
    needs: [verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout trusted main without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Install schema dependencies
        run: python3 -m pip install -r .factory/requirements-dev.txt
      - name: Apply verified audit and close only fully complete Issues
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ needs.verify.outputs.main_sha }}
          CLOSURE_PROOF: ${{ needs.verify.outputs.proof }}
        run: |
          python3 .factory/scripts/post_merge_closure.py apply --sha "$MAIN_SHA"
