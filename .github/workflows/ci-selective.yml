name: Factory selective CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: factory-selective-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      manifest: ${{ steps.compute.outputs.manifest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: compute
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .factory/scripts/compute_impact.py --base "$BASE_SHA" --head "$HEAD_SHA" --output "$GITHUB_OUTPUT"
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout against GitHub event
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_KIND: ${{ github.event_name }}
        run: python3 .factory/scripts/checkout_identity.py --event "$EVENT_KIND" --head "$HEAD_SHA" --run "$EVENT_SHA"
      - name: Check committed PR patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"
      - name: Install policy dependencies
        run: python3 -m pip install -r .factory/requirements-dev.txt
      - name: Run mandatory secret and pinned-workflow checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .factory/scripts/scan_security.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Validate repository configuration
        run: python3 .factory/scripts/validate_config.py
      # Factory bootstrap is the mandatory owner of .factory/tests; the policy
      # lane keeps the permanent acceptance safety barrier without rerunning it.
      - name: Execute all durable Issue acceptance regressions
        run: python3 .factory/scripts/run_permanent_acceptance.py
  scanner:
    needs: [impact]
    if: fromJSON(needs.impact.outputs.manifest).selected_jobs.scanner
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .factory/requirements-dev.txt
      - run: python -m pip install -e . -r .factory/requirements-dev.txt
      - name: Run scanner unit tests with measured coverage
        run: |
          mkdir -p reports
          python -m coverage run --source=insurance -m unittest discover -s tests -v
          python -m coverage json -o reports/coverage.json
      - name: Enforce repository-owned 90-percent changed production line floor
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python .factory/scripts/diff_coverage.py --base "$BASE_SHA" --head "$HEAD_SHA" --coverage reports/coverage.json
      - name: Assert invalid quote paths are NO TRADE
        run: |
          python .factory/scripts/scanner_safety_gate.py
          insurance --help
      - name: Preserve measured scanner coverage and safety reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scanner-diff-coverage
          path: reports/coverage.json
          if-no-files-found: warn
  factory:
    needs: [impact]
    if: fromJSON(needs.impact.outputs.manifest).selected_jobs.factory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate selected factory Python syntax
        run: python3 -m compileall -q .factory/scripts .factory/acceptance
  docs:
    needs: [impact]
    if: fromJSON(needs.impact.outputs.manifest).selected_jobs.docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 .factory/scripts/validate_docs.py
  macos:
    needs: [impact]
    if: fromJSON(needs.impact.outputs.manifest).selected_jobs.macos
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .factory/requirements-dev.txt
      - run: |
          python3 -m pip install -e . -r .factory/requirements-dev.txt
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s .factory/tests -v
  windows:
    needs: [impact]
    if: fromJSON(needs.impact.outputs.manifest).selected_jobs.windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .factory/requirements-dev.txt
      - run: |
          python -m pip install -e . -r .factory/requirements-dev.txt
          python -m unittest discover -s tests -v
          python -m unittest discover -s .factory/tests -v
  issue-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout against GitHub event
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_KIND: ${{ github.event_name }}
        run: python3 .factory/scripts/checkout_identity.py --event "$EVENT_KIND" --head "$HEAD_SHA" --run "$EVENT_SHA"
      - name: Install trusted schema dependencies
        run: python3 -m pip install -r .factory/requirements-dev.txt
      - name: Fetch PR-linked Issue metadata without running repository scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.request
          path = os.environ.get("GITHUB_EVENT_PATH", "")
          event = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
          body = (event.get("pull_request") or {}).get("body") or ""
          ids = sorted({int(s) for s in re.findall(
              r"(?im)^\s*(?:Refs|Completes)\s+#([1-9][0-9]*)\s*$", body
          )})
          if len(ids) > 10:
              raise SystemExit("Too many linked completion issues")
          payload = {}
          for n in ids:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{n}",
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload[str(n)] = json.load(response)
          # The only no-Issue exception is SHA-bound owner authorization for
          # a docs-only maintenance PR. Read metadata in this token-bearing,
          # repository-workflow step, never in candidate test code.
          if not ids and event.get("pull_request"):
              pr = event["pull_request"]
              pr_number = pr["number"]
              expected_head = pr["head"]["sha"]
              owner = os.environ["GITHUB_REPOSITORY_OWNER"].lower()
              def read_public(path):
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}{path}",
                      headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                               "Accept": "application/vnd.github+json"},
                  )
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return json.load(response)
              comments = read_public(f"/issues/{pr_number}/comments?per_page=100")
              changed = read_public(f"/pulls/{pr_number}/files?per_page=100")
              if len(comments) >= 100 or len(changed) >= 100:
                  raise SystemExit("Maintenance approval evidence pagination incomplete")
              marker = re.compile(
                  r"^FACTORY-MAINTENANCE-AUTH sha=([a-f0-9]{40}) reason=(.{12,300})$"
              )
              authorized_reason = ""
              for comment in comments:
                  match = marker.fullmatch((comment.get("body") or "").strip())
                  if (match and match.group(1) == expected_head
                          and (comment.get("user") or {}).get("login", "").lower() == owner):
                      authorized_reason = match.group(2)
              payload["_maintenance"] = {
                  "head_sha": expected_head,
                  "owner_authorized": bool(authorized_reason),
                  "reason": authorized_reason,
                  "changed_paths": [f["filename"] for f in changed],
              }
          pathlib.Path("completion-issues.json").write_text(
              json.dumps(payload), encoding="utf-8"
          )
          PY
      - name: Verify full acceptance in a token-free step
        env:
          COMPLETION_ISSUES_PATH: completion-issues.json
        run: python3 .factory/scripts/pr_completion_gate.py
      - name: Preserve acceptance JUnit on completion claims
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-issue-completion-evidence
          path: reports/*.xml
          if-no-files-found: ignore
  acceptance-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .factory/requirements-dev.txt
      - run: python3 -m pip install -r .factory/requirements-dev.txt
      - name: Fetch Issue metadata separately from execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .factory/scripts/fetch_acceptance_issues.py --output issue-bodies.json
      - name: Run actual macos-latest criteria without API credentials
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: python3 .factory/scripts/cross_os_acceptance.py --runner macos-latest --head "$HEAD_SHA" --run-id "$RUN_ID" --issues issue-bodies.json --output evidence.json
      - name: Preserve hosted JUnit and evidence index
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acceptance-macos
          path: |
            evidence.json
            reports/cross_os/*.xml
          if-no-files-found: warn
  acceptance-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .factory/requirements-dev.txt
      - run: python -m pip install -r .factory/requirements-dev.txt
      - name: Fetch Issue metadata separately from execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .factory/scripts/fetch_acceptance_issues.py --output issue-bodies.json
      - name: Run actual windows-latest criteria without API credentials
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: python .factory/scripts/cross_os_acceptance.py --runner windows-latest --head "$env:HEAD_SHA" --run-id "$env:RUN_ID" --issues issue-bodies.json --output evidence.json
      - name: Preserve hosted JUnit and evidence index
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acceptance-windows
          path: |
            evidence.json
            reports/cross_os/*.xml
          if-no-files-found: warn
  factory-gate-preflight:
    if: always()
    needs: [impact, policy, issue-completion, scanner, factory, docs, macos, windows, acceptance-macos, acceptance-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout against GitHub event
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_KIND: ${{ github.event_name }}
        run: python3 .factory/scripts/checkout_identity.py --event "$EVENT_KIND" --head "$HEAD_SHA" --run "$EVENT_SHA"
      - name: Verify aggregate gate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IMPACT_MANIFEST: ${{ needs.impact.outputs.manifest }}
          RESULT_IMPACT: ${{ needs.impact.result }}
          RESULT_POLICY: ${{ needs.policy.result }}
          RESULT_ISSUE_COMPLETION: ${{ needs.issue-completion.result }}
          RESULT_SCANNER: ${{ needs.scanner.result }}
          RESULT_FACTORY: ${{ needs.factory.result }}
          RESULT_DOCS: ${{ needs.docs.result }}
          RESULT_MACOS: ${{ needs.macos.result }}
          RESULT_WINDOWS: ${{ needs.windows.result }}
          RESULT_ACCEPTANCE_MACOS: ${{ needs.acceptance-macos.result }}
          RESULT_ACCEPTANCE_WINDOWS: ${{ needs.acceptance-windows.result }}
        run: python3 .factory/scripts/verify_factory_gate.py
