name: Research scanner CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: scanner-unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install local package
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI help
        run: insurance --help
      - name: Validate reproducible README demo and local links
        run: |
          python scripts/readme_demo.py --check
          python scripts/check_readme.py
      - name: Verify actual IBKR frozen snapshot is rejected
        run: insurance --snapshot data/observations/2026-10-17-frozen.json --database /tmp/insurance-ci.db
