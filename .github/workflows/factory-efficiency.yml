name: Factory efficiency dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '13 */6 * * *'
permissions:
  contents: read
concurrency:
  group: insurance-factory-efficiency-dashboard
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Read versioned GitHub-only production metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .factory/scripts/factory_efficiency.py --mode collect --output reports/factory-efficiency-v1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: factory-efficiency-v1
          path: reports/factory-efficiency-v1.json
          retention-days: 90
  publish:
    needs: [collect]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: factory-efficiency-v1
          path: reports
      - name: Update exactly one Issue 71 tracking comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .factory/scripts/factory_efficiency.py --mode publish --input reports/factory-efficiency-v1.json
