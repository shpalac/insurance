name: Factory trusted PR admission
on:
  workflow_run:
    workflows: ["Factory selective CI"]
    types: [completed]
permissions:
  contents: read
jobs:
  attest-pr:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: read
      issues: read
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Publish head-SHA trusted admission status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .factory/scripts/trusted_admission.py
