name: Factory executable issue
description: CI-proven task whose completed PR closes the issue automatically
labels: ["status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        The PR begins with a standalone `Refs #N`; audited post-merge closure verifies every criterion.
        Required `issue-completion` CI verifies all co-shipped AC tests before merge.
        After merge, the main-branch verifier writes the audit and automatically closes this Issue.
        Prefer one PR per Issue. Declare dependencies and allowed paths.
        For protected files obtain a fresh exact-head FACTORY-OWNER-AUTH comment.
        No independent reviewer approval is required, but all five checks remain mandatory.
  - type: textarea
    id: objective
    attributes:
      label: Objective and scope
      description: What needs to work, why, and which paths or interfaces can change
    validations:
      required: true
  - type: textarea
    id: factory_alignment
    attributes:
      label: Factory alignment and boundaries
      description: How does the task preserve required CI, issue closure, roles, authorization and project architecture?
      placeholder: Preserve immutable commit evidence and fail-closed acceptance. Specify non-goals.
    validations:
      required: true
  - type: textarea
    id: observable_criteria
    attributes:
      label: Observable acceptance criteria
      description: List AC-1, AC-2, ... as independently executable behaviors, including negative and failure cases.
      placeholder: |
        AC-1: A named test proves the happy path.
        AC-2: A named test proves a failure is blocked.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Executable acceptance manifest
      description: |
        The issue ID is resolved automatically. Replace the placeholder test description, paths,
        and command metadata with the actual criteria. Each PR co-ships .factory/acceptance/issue_N/test_ac_K.py for every AC,
        with runtime assertions and a valid JUnit result; do not copy Issue-authored commands into CI.
      value: |
        ```yaml factory-acceptance-manifest
        schema_version: "1.0"
        issue_id: "self"
        title: "Replace with this issue's acceptance contract"
        scope:
          allowed_paths: ["src/**", "tests/**"]
          protected_paths: []
        dependencies:
          depends_on_issues: []
          multi_pr_allowed: false
        acceptance_criteria:
          - id: "AC-1"
            description: "A runner-executable test proves the required observable behavior."
            verification_type: integration
            runner_os: ubuntu-latest
            command: "python -m unittest discover -s tests"
            expected_exit_code: 0
            required_report: "reports/ac-1.xml"
            timeout_seconds: 120
        definition_of_done:
          require_new_or_updated_tests: true
          min_diff_coverage_percent: 90
          require_architecture_doc_sync: true
        ```
    validations:
      required: true
